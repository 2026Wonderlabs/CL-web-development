<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Contact</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo"><img src="logo.jpg" alt="Logo"></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h1>Contact Me</h1>
      <p>Have a project or question? Fill out the form below and I’ll get back to you.</p>
    </div>
    <div id="contdet">
        or email me at <a href="mailto:cauleyleighton@gmail.com">cauleyleighton@gmail.com</a>
        or text/ring me on <a href ="tel:+44 7359 455943">+44 7359 455943</a>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="contact-section">
    <div class="contact-container">
      <h2>Get In Touch</h2>
      <form id="contact-form" action="https://formspree.io/f/xyzqwert" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
        
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required placeholder="What's this about?">
        
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Your message..."></textarea>
        
        <button type="submit">Send Message</button>
      </form>
      <p class="form-note">Or reach out directly via email or phone in the section above.</p>
    </div>
  </section>

</body>
</html>
